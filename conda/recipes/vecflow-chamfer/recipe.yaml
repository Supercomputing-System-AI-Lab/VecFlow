# SPDX-License-Identifier: Apache-2.0
#
# Python wrapper recipe for vecflow-chamfer. Depends on libvecflow-chamfer
# (which transitively pulls libcuvs-vecflow). The build is small — just the
# pybind11 binding linked against the precompiled libvecflow_chamfer.so.
#
# Output: vecflow-chamfer-cu{12,13}, version from vecflow/VERSION (shared
# with the vecflow Python package — same release tag bumps both).

schema_version: 1

context:
  version: ${{ env.get("VECFLOW_VERSION", default="0.2.0") }}
  cuda_version: ${{ env.get("RAPIDS_CUDA_VERSION", default="12.9") }}
  cuda_major: ${{ (cuda_version | split("."))[0] }}
  py_version: ${{ env.get("RAPIDS_PY_VERSION", default="3.12") }}

package:
  name: vecflow-chamfer-cu${{ cuda_major }}
  version: ${{ version }}

source:
  path: ../../..

build:
  number: 0
  string: cuda${{ cuda_major }}_py${{ py_version | replace(".", "") }}_h${{ hash }}_${{ build_number }}
  skip:
    - not linux
  script:
    content: |
      set -euo pipefail
      cd vecflow-chamfer
      pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ compiler("cuda") }}
    - cuda-version =${{ cuda_version }}
    - cmake >=3.30.4
    - ninja
    - ${{ stdlib("c") }}
  host:
    - python =${{ py_version }}
    - pip
    - scikit-build-core >=0.10
    - pybind11 >=2.11
    - cuda-version =${{ cuda_version }}
    - cuda-cudart-dev
    # Strict version pin — vecflow-chamfer Python links against the matching
    # libvecflow-chamfer SO. libcuvs-vecflow is pulled transitively.
    - libvecflow-chamfer-cu${{ cuda_major }} ==${{ version }}
  run:
    - python =${{ py_version }}
    - numpy >=1.19
    - ${{ pin_compatible("cuda-version", upper_bound="x", lower_bound="x") }}
    - libvecflow-chamfer-cu${{ cuda_major }} ==${{ version }}
  ignore_run_exports:
    by_name:
      - cuda-cudart
      - cuda-version

about:
  homepage: https://github.com/Supercomputing-System-AI-Lab/VecFlow
  license: Apache-2.0
  summary: vecflow-chamfer Python bindings (multi-vector retrieval on GPU)
  description: |
    Python bindings for vecflow-chamfer. Exposes Dataset / QuerySet / Index
    classes and free build/search/serialize/deserialize functions over the
    C++ MaxIVF + chamfer-rerank pipeline. Depends on libvecflow-chamfer for
    the underlying CUDA library.

    Install:

        mamba install -c VecFlow -c rapidsai-nightly -c rapidsai \
                      -c conda-forge vecflow-chamfer-cu12
