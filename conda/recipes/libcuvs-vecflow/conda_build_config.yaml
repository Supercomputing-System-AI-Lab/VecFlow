#
# Build-tooling pins for libcuvs-vecflow. Mirrors cuVS's own
# conda/recipes/libcuvs/conda_build_config.yaml so the patched build uses
# the same toolchain as upstream.
c_compiler_version:
  - 14
cxx_compiler_version:
  - 14
cuda_compiler:
  - cuda-nvcc
c_stdlib:
  - sysroot
c_stdlib_version:
  - "2.28"
cmake_version:
  - ">=3.30.4"
nccl_version:
  - ">=2.19"
